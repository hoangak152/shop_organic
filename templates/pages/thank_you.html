{% extends 'base.html' %}
{% load static %}
{% block body_block %}
<section class="py-5 bg-light text-center">
  <div class="container-lg py-5">
    <div class="display-1 text-primary mb-3">✓</div>
    <h1 class="display-4 fw-bold">Thank you for your order!</h1>
    <p class="fs-5 text-muted">Your order has been received.</p>
    <div class="card border-0 shadow-sm rounded-4 p-4 mx-auto my-4" style="max-width: 520px;">
      <div class="d-flex justify-content-between border-bottom py-3"><span>Order number</span><strong>#ORG-2026-1042</strong></div>
      <div class="d-flex justify-content-between border-bottom py-3"><span>Payment</span><strong>Cash on delivery</strong></div>
      <div class="d-flex justify-content-between py-3"><span>Total</span><strong>${{ order_total }}</strong></div>
    </div>
    <a href="{% url 'pages:shop' %}" class="btn btn-primary btn-lg rounded-pill px-5">Back to Shop</a>
  </div>
</section>
{% endblock %}
