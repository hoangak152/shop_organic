{% extends 'base.html' %}
{% load static %}
{% block body_block %}
{% if  accCategory %}
{% for acc in accCategory %}
  <!-- Fruits start -->
  <div class="about wow fadeInUp" data-wow-delay="0.1s">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-5 col-md-6">
                <div class="about-img">
                    <img src="{{acc.image}}" width="550px" height="500px" alt="Image">
                </div>
            </div>
            <div class="col-lg-7 col-md-6">
                <div class="section-header text-left">
                    <p>{{acc.name}}</p>
                    <h2>{{acc.title}}</h2>
                </div>

                <div class="about-text">
                    <p>{{acc.description}}</p>
                    <p>{{acc.content}}</p>
                </div>
            </div>
        </div>
    </div>
  </div>
{% endfor %}
{% endif %}
{% endblock %}
