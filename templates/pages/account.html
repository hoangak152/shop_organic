{% extends 'base.html' %}
{% load static %}
{% block body_block %}
<section class="py-5 bg-light">
  <div class="container-lg">
    <h1 class="display-4 fw-bold">My Account</h1>
    <p class="fs-5 text-muted">Login, register, and manage orders.</p>
  </div>
</section>

<section class="py-5">
  <div class="container-lg">
    <div class="row g-5">
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
          <h3>Login</h3>
          <form class="mt-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control form-control-lg mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg mb-3">
            <button type="button" class="btn btn-primary btn-lg rounded-pill px-5">Login</button>
          </form>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
          <h3>Create account</h3>
          <form class="mt-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control form-control-lg mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control form-control-lg mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg mb-3">
            <button type="button" class="btn btn-dark btn-lg rounded-pill px-5">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
